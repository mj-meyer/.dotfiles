name = "Notes"
description = "Obsidian vault and personal notes"
group = "Personal"
# $VARS are expanded by herdr-plus (os.ExpandEnv), so this resolves to
# ~/Notes on the work machine and ~/Documents/Notes personally.
# NOTES_DIR is set in zsh/.zshrc.
working_dir = "$NOTES_DIR"

[[tabs]]
name = "editor"
command = "nvim"

[[tabs]]
name = "terminal"
